<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- QR Code pattern -->
  <rect width="32" height="32" fill="#10b981"/>
  <!-- Position markers -->
  <rect x="0" y="0" width="7" height="7" fill="#ffffff"/>
  <rect x="1" y="1" width="5" height="5" fill="#10b981"/>
  <rect x="2" y="2" width="3" height="3" fill="#ffffff"/>
  <rect x="3" y="3" width="1" height="1" fill="#10b981"/>
  <!-- Top-right marker -->
  <rect x="25" y="0" width="7" height="7" fill="#ffffff"/>
  <rect x="26" y="1" width="5" height="5" fill="#10b981"/>
  <rect x="27" y="2" width="3" height="3" fill="#ffffff"/>
  <rect x="28" y="3" width="1" height="1" fill="#10b981"/>
  <!-- Bottom-left marker -->
  <rect x="0" y="25" width="7" height="7" fill="#ffffff"/>
  <rect x="1" y="26" width="5" height="5" fill="#10b981"/>
  <rect x="2" y="27" width="3" height="3" fill="#ffffff"/>
  <rect x="3" y="28" width="1" height="1" fill="#10b981"/>
  <!-- Central pattern -->
  <rect x="12" y="12" width="8" height="8" fill="#ffffff"/>
  <rect x="13" y="13" width="6" height="6" fill="#10b981"/>
  <rect x="14" y="14" width="4" height="4" fill="#ffffff"/>
  <rect x="15" y="15" width="2" height="2" fill="#10b981"/>
</svg>
